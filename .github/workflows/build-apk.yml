name: Build APK

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Gerar Kubex 3D APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependências e sincronizar o Capacitor
        run: |
          npm ci
          npm run prepare:www
          npx cap sync android

      - name: Compilar APK instalável
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Preparar e verificar o APK
        run: |
          mkdir -p apk-output
          cp android/app/build/outputs/apk/debug/app-debug.apk apk-output/Kubex-3D.apk
          APKSIGNER=$(ls -1 "${ANDROID_HOME}"/build-tools/*/apksigner | sort -V | tail -n 1)
          "${APKSIGNER}" verify --verbose apk-output/Kubex-3D.apk
          sha256sum apk-output/Kubex-3D.apk | tee apk-output/Kubex-3D.apk.sha256
          ls -lh apk-output/

      - name: Publicar APK nos Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Kubex-3D-APK
          path: apk-output/Kubex-3D.apk
          if-no-files-found: error

      - name: Publicar APK em Releases
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: Kubex 3D APK
          body: |
            ## Kubex 3D — APK pronto para instalar

            Baixe **Kubex-3D.apk** abaixo e instale no Android.

            - Modelador 3D mobile inspirado no Blender
            - Visual preto e branco com a logo Kubex 3D
            - Adicionar cubo, esfera, cilindro, cone e toro
            - Selecionar, mover, rotacionar, escalar e excluir objetos
            - Painel de propriedades com localização, rotação e escala
            - Three.js embutido no APK: funciona sem depender de CDN
          files: apk-output/Kubex-3D.apk
          prerelease: false
          make_latest: true
          overwrite_files: true
