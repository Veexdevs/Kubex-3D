<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Kubex 3D — Modelador 3D</title>
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#000000" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="Kubex 3D" />
  <link rel="apple-touch-icon" href="/assets/logo-kubex-no-text.png" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div id="app">
    <!-- Barra superior -->
    <header class="topbar">
      <div class="brand">
        <img src="/assets/logo-kubex.png" alt="Kubex 3D" class="logo" />
        <span class="appname">Kubex 3D</span>
      </div>
      <div class="top-actions" id="topActions">
        <button class="tb-btn" id="btnAddCube" title="Adicionar Cubo">+ Cubo</button>
        <button class="tb-btn" id="btnDelete" title="Excluir objeto">Excluir</button>
      </div>
    </header>

    <!-- Viewport 3D -->
    <div class="viewport-wrap">
      <div id="canvas-container"></div>
      <div class="grid-hint">Arraste com um dedo para orbitar • Dois dedos para mover/zoom</div>
      <div class="axis" id="axis">
        <div class="ax ax-x">X</div>
        <div class="ax ax-y">Y</div>
        <div class="ax ax-z">Z</div>
      </div>
    </div>

    <!-- Barra inferior de ferramentas (estilo Blender) -->
    <footer class="toolbar">
      <button class="tool" id="toolSelect" data-tool="select" title="Selecionar">Selecionar</button>
      <button class="tool active" id="toolMove" data-tool="move" title="Mover (G)">Mover</button>
      <button class="tool" id="toolRotate" data-tool="rotate" title="Rotacionar (R)">Rotacionar</button>
      <button class="tool" id="toolScale" data-tool="scale" title="Escalar (S)">Escalar</button>
      <button class="tool" id="toolAdd" data-tool="add" title="Adicionar">Adicionar</button>
    </footer>

    <!-- Painel de propriedades (lateral direita) -->
    <aside class="panel" id="panel">
      <div class="panel-header">Objeto</div>
      <div class="panel-body">
        <div class="row"><label>Nome</label><input type="text" id="propName" value="Cubo" readonly /></div>
        <div class="row"><label>Tipo</label><span id="propType">Malha</span></div>
        <div class="sep">Localização</div>
        <div class="row"><label>X</label><input type="number" id="pLocX" step="0.1" /></div>
        <div class="row"><label>Y</label><input type="number" id="pLocY" step="0.1" /></div>
        <div class="row"><label>Z</label><input type="number" id="pLocZ" step="0.1" /></div>
        <div class="sep">Rotação</div>
        <div class="row"><label>X</label><input type="number" id="pRotX" step="1" /></div>
        <div class="row"><label>Y</label><input type="number" id="pRotY" step="1" /></div>
        <div class="row"><label>Z</label><input type="number" id="pRotZ" step="1" /></div>
        <div class="sep">Escala</div>
        <div class="row"><label>X</label><input type="number" id="pScaX" step="0.1" /></div>
        <div class="row"><label>Y</label><input type="number" id="pScaY" step="0.1" /></div>
        <div class="row"><label>Z</label><input type="number" id="pScaZ" step="0.1" /></div>
      </div>
    </aside>

    <!-- Overlay de adicionar -->
    <div class="modal" id="modalAdd">
      <div class="modal-card">
        <div class="modal-header">Adicionar objeto</div>
        <div class="modal-body">
          <button class="add-opt" data-type="box">Cubo</button>
          <button class="add-opt" data-type="sphere">Esfera</button>
          <button class="add-opt" data-type="cylinder">Cilindro</button>
          <button class="add-opt" data-type="cone">Cone</button>
          <button class="add-opt" data-type="torus">Toro</button>
        </div>
        <button class="btn-close" id="btnCloseAdd">Fechar</button>
      </div>
    </div>

    <!-- Toast -->
    <div id="toast"></div>
  </div>

  <!-- Three.js -->
  <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
  <script src="https://unpkg.com/three@0.160.0/examples/js/controls/OrbitControls.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
